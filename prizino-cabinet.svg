<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 990" width="690" height="990" class="pz-cabinet-art" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid meet">
  <!--
    PRIZINO ARCADE CABINET — static machine artwork
    Canvas 690 x 990. The live account UI sits on top of this artwork at these zones:
      userbar   46,30   598 x 46        level   66,86  558 x 46
      coins     39,142  196 x 46 (x3, 12 gap)
      screen    56,216  578 x 556       ad      70,798 550 x 72
      Games     150,894 170 x 36        Prizes  370,894 170 x 36
      Star Pick 250,940 190 x 34
    Keep these zones in place when editing, or update the matching values in index.php.
    On tall phones the page grows the screen: shapes marked data-pz="stretch" get taller
    and the Lower-Cabinet group moves down. Everything else keeps its exact shape.
  -->
  <defs>
    <linearGradient id="pz-chrome-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbff"/>
      <stop offset=".18" stop-color="#c9c8d6"/>
      <stop offset=".45" stop-color="#7d7b91"/>
      <stop offset=".55" stop-color="#e7e6f0"/>
      <stop offset=".8" stop-color="#9b99ad"/>
      <stop offset="1" stop-color="#5d5b70"/>
    </linearGradient>
    <linearGradient id="pz-chrome-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d5b70"/>
      <stop offset=".25" stop-color="#f4f3fb"/>
      <stop offset=".5" stop-color="#a3a1b6"/>
      <stop offset=".75" stop-color="#e2e1ec"/>
      <stop offset="1" stop-color="#55536a"/>
    </linearGradient>
    <linearGradient id="pz-silver-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5fb"/>
      <stop offset=".5" stop-color="#d6d4e2"/>
      <stop offset="1" stop-color="#aeacc0"/>
    </linearGradient>
    <linearGradient id="pz-purple-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a9c"/>
      <stop offset=".55" stop-color="#3b1774"/>
      <stop offset="1" stop-color="#26104e"/>
    </linearGradient>
    <linearGradient id="pz-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0b36"/>
      <stop offset=".5" stop-color="#2c1458"/>
      <stop offset="1" stop-color="#1a0b36"/>
    </linearGradient>
    <linearGradient id="pz-gold-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset=".35" stop-color="#e2ad3f"/>
      <stop offset=".6" stop-color="#8a5d14"/>
      <stop offset="1" stop-color="#f0c65a"/>
    </linearGradient>
    <linearGradient id="pz-gunmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2833"/>
      <stop offset=".5" stop-color="#121118"/>
      <stop offset="1" stop-color="#26242e"/>
    </linearGradient>
    <linearGradient id="pz-brushed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d8e0"/>
      <stop offset=".12" stop-color="#a9a8b4"/>
      <stop offset=".5" stop-color="#8d8c98"/>
      <stop offset="1" stop-color="#6c6b78"/>
    </linearGradient>
    <linearGradient id="pz-deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d2190"/>
      <stop offset="1" stop-color="#220c48"/>
    </linearGradient>
    <radialGradient id="pz-glass" cx=".5" cy=".38" r=".75">
      <stop offset="0" stop-color="#5b2aa6"/>
      <stop offset=".55" stop-color="#3a1673"/>
      <stop offset="1" stop-color="#140628"/>
    </radialGradient>
    <radialGradient id="pz-vignette" cx=".5" cy=".5" r=".72">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </radialGradient>
    <radialGradient id="pz-coin-gold" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset=".45" stop-color="#f3c041"/>
      <stop offset="1" stop-color="#9a6609"/>
    </radialGradient>
    <radialGradient id="pz-coin-silver" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#c9cfdc"/>
      <stop offset="1" stop-color="#6b7286"/>
    </radialGradient>
    <radialGradient id="pz-coin-pr" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#cfd6ff"/>
      <stop offset=".45" stop-color="#5c5cf0"/>
      <stop offset="1" stop-color="#2a1a8a"/>
    </radialGradient>
    <linearGradient id="pz-strip-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e23cff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff7af0"/>
      <stop offset="1" stop-color="#e23cff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pz-circuit" width="96" height="96" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#b58cff" stroke-width="1.4" stroke-opacity=".22" stroke-linecap="round">
        <path d="M0 18h30l12 12h26M96 18H82M8 48h20l10-10h22l14 14h22M0 78h14l10 10h36l10-10h26M48 0v8l10 10M70 96V74l-8-8"/>
      </g>
      <g fill="#b58cff" fill-opacity=".32">
        <circle cx="68" cy="30" r="2.6"/><circle cx="60" cy="38" r="2.6"/><circle cx="24" cy="88" r="2.6"/><circle cx="58" cy="18" r="2.2"/><circle cx="62" cy="66" r="2.2"/>
      </g>
    </pattern>
    <pattern id="pz-chevrons" width="14" height="46" patternUnits="userSpaceOnUse">
      <path d="M0 0l10 23L0 46h4l10-23L4 0z" fill="#9b5cff" fill-opacity=".55"/>
    </pattern>
    <pattern id="pz-brush-lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1h4" stroke="#fff" stroke-opacity=".08"/>
    </pattern>
    <filter id="pz-soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- ===== CABINET BODY ===== -->
  <g id="Cabinet-Body">
    <rect x="40" y="196" width="610" height="692" fill="url(#pz-body)" data-pz="stretch"/>
    <!-- chrome side rails -->
    <rect x="24" y="196" width="22" height="692" rx="6" fill="url(#pz-chrome-h)" data-pz="stretch"/>
    <rect x="644" y="196" width="22" height="692" rx="6" fill="url(#pz-chrome-h)" data-pz="stretch"/>
    <!-- neon trim inside the rails -->
    <rect x="44" y="214" width="4" height="660" rx="2" fill="#e23cff" opacity=".85" data-pz="stretch"/>
    <rect x="642" y="214" width="4" height="660" rx="2" fill="#e23cff" opacity=".85" data-pz="stretch"/>
  </g>

  <!-- ===== HEADER CAP ===== -->
  <g id="Header-Cap">
    <path d="M14 206V40Q14 6 48 6H642Q676 6 676 40V206Z" fill="url(#pz-chrome-v)"/>
    <path d="M30 196V44Q30 20 54 20H636Q660 20 660 44V196Z" fill="url(#pz-purple-panel)"/>
    <path d="M30 196V44Q30 20 54 20H636Q660 20 660 44V196Z" fill="none" stroke="#1c0a3a" stroke-width="2"/>
    <!-- side chevron plates beside the level bar -->
    <rect x="36" y="86" width="28" height="46" fill="url(#pz-chevrons)"/>
    <rect x="36" y="86" width="28" height="46" fill="url(#pz-chevrons)" transform="translate(690 0) scale(-1 1)"/>
    <!-- base trim under the cap -->
    <rect x="14" y="196" width="662" height="12" rx="3" fill="url(#pz-chrome-v)"/>
    <rect x="60" y="200" width="570" height="3" fill="url(#pz-strip-glow)"/>
  </g>

  <!-- ===== USERBAR PLATE ===== -->
  <g id="Userbar">
    <rect x="44" y="28" width="602" height="50" rx="14" fill="#1b0b36"/>
    <rect x="46" y="30" width="598" height="46" rx="12" fill="url(#pz-silver-plate)"/>
    <rect x="46" y="30" width="598" height="46" rx="12" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1"/>
    <rect x="56" y="40" width="64" height="26" rx="6" fill="#000" fill-opacity=".08"/>
  </g>

  <!-- ===== LEVEL PLATE ===== -->
  <g id="Level-Plate">
    <path d="M86 84H604L626 109L604 134H86L64 109Z" fill="url(#pz-chrome-v)"/>
    <path d="M88 88H602L620 109L602 130H88L70 109Z" fill="#1a0a34"/>
    <path d="M88 88H602L620 109L602 130H88L70 109Z" fill="none" stroke="#e23cff" stroke-opacity=".45" stroke-width="1.5"/>
  </g>

  <!-- ===== COIN DISPLAYS ===== -->
  <g id="Coin-Displays">
    <g id="Coin-Window-Tz">
      <rect x="39" y="142" width="196" height="46" rx="9" fill="url(#pz-gold-frame)"/>
      <rect x="85" y="147" width="145" height="36" rx="5" fill="#070309"/>
      <rect x="85" y="147" width="145" height="12" rx="5" fill="#fff" fill-opacity=".05"/>
      <!-- Tokenz: gold shield -->
      <path d="M44 146H86V170Q86 184 65 192Q44 184 44 170Z" fill="url(#pz-coin-gold)" stroke="#7a4f08" stroke-width="1.5" filter="url(#pz-soft-shadow)"/>
      <path d="M49 151H81V169Q81 179 65 186Q49 179 49 169Z" fill="none" stroke="#fff3c0" stroke-opacity=".7" stroke-width="1.2"/>
      <text x="65" y="174" text-anchor="middle" font-family="Comfortaa, Arial, sans-serif" font-weight="700" font-size="15" fill="#6b4300">Tz</text>
    </g>
    <g id="Coin-Window-Dz">
      <rect x="247" y="142" width="196" height="46" rx="9" fill="url(#pz-gold-frame)"/>
      <rect x="293" y="147" width="145" height="36" rx="5" fill="#070309"/>
      <rect x="293" y="147" width="145" height="12" rx="5" fill="#fff" fill-opacity=".05"/>
      <!-- Dimenz: silver coin -->
      <circle cx="272" cy="165" r="22" fill="url(#pz-coin-silver)" stroke="#5a6074" stroke-width="1.5" filter="url(#pz-soft-shadow)"/>
      <circle cx="272" cy="165" r="17" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="2 2.4"/>
      <text x="272" y="170" text-anchor="middle" font-family="Comfortaa, Arial, sans-serif" font-weight="700" font-size="14" fill="#3e4458">Dz</text>
    </g>
    <g id="Coin-Window-PR">
      <rect x="455" y="142" width="196" height="46" rx="9" fill="url(#pz-gold-frame)"/>
      <rect x="501" y="147" width="145" height="36" rx="5" fill="#070309"/>
      <rect x="501" y="147" width="145" height="12" rx="5" fill="#fff" fill-opacity=".05"/>
      <!-- Prizino Rewards: blue-violet coin -->
      <circle cx="480" cy="165" r="22" fill="url(#pz-coin-pr)" stroke="#1f1470" stroke-width="1.5" filter="url(#pz-soft-shadow)"/>
      <circle cx="480" cy="165" r="17" fill="none" stroke="#dfe3ff" stroke-opacity=".7" stroke-width="1.2"/>
      <text x="480" y="170" text-anchor="middle" font-family="Comfortaa, Arial, sans-serif" font-weight="700" font-size="14" fill="#ffffff">PR</text>
    </g>
  </g>

  <!-- ===== SCREEN ===== -->
  <g id="Screen-Bezel">
    <rect x="44" y="206" width="602" height="580" rx="10" fill="url(#pz-gunmetal)" data-pz="stretch"/>
    <rect x="50" y="210" width="590" height="568" rx="16" fill="#05020b" data-pz="stretch"/>
  </g>
  <g id="Screen-Glass">
    <rect x="56" y="216" width="578" height="556" rx="14" data-pz="stretch" fill="url(#pz-glass)"/>
    <rect x="56" y="216" width="578" height="556" rx="14" data-pz="stretch" fill="url(#pz-circuit)"/>
    <rect x="56" y="216" width="578" height="556" rx="14" data-pz="stretch" fill="url(#pz-vignette)"/>
  </g>

  <!-- ===== LOWER CABINET (moves down when the screen grows on tall phones) ===== -->
  <g id="Lower-Cabinet" data-pz="shift">
  <!-- ===== AD PANEL ===== -->
  <g id="Ad-Panel">
    <rect x="40" y="784" width="610" height="100" fill="url(#pz-brushed)"/>
    <rect x="40" y="784" width="610" height="100" fill="url(#pz-brush-lines)"/>
    <rect x="40" y="784" width="610" height="3" fill="#fff" fill-opacity=".55"/>
    <rect x="66" y="794" width="558" height="80" rx="11" fill="#3f3e48"/>
    <rect x="70" y="798" width="550" height="72" rx="8" fill="#55545f"/>
    <!-- screws -->
    <g fill="#d9d8e2" stroke="#55545f" stroke-width="1">
      <circle cx="53" cy="797" r="4"/><circle cx="637" cy="797" r="4"/><circle cx="53" cy="871" r="4"/><circle cx="637" cy="871" r="4"/>
    </g>
  </g>

  <!-- ===== CONTROL DECK ===== -->
  <g id="Control-Deck">
    <path d="M40 880H650L686 980Q688 988 680 988H10Q2 988 4 980Z" fill="url(#pz-chrome-v)"/>
    <path d="M52 890H638L668 978H22Z" fill="url(#pz-deck)"/>
    <path d="M52 890H638L641 898H49Z" fill="#ffffff" fill-opacity=".12"/>
    <!-- Star Pick plinth -->
    <path d="M214 934H476L500 978H190Z" fill="#170632"/>
    <path d="M214 934H476L500 978H190Z" fill="none" stroke="#e23cff" stroke-opacity=".5" stroke-width="1.5"/>
    <!-- neon strip -->
    <rect x="90" y="884" width="510" height="3" fill="url(#pz-strip-glow)"/>
  </g>

  <!-- ===== BUTTON WELLS (buttons are live UI on top) ===== -->
  <g id="Button-Wells" fill="#0b0418" stroke="#000" stroke-opacity=".6">
    <rect x="144" y="891" width="182" height="44" rx="10"/>
    <rect x="364" y="891" width="182" height="44" rx="10"/>
    <rect x="244" y="937" width="202" height="42" rx="10"/>
  </g>
  </g>
</svg>
